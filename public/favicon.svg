<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dharshanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#dharshanGradient)" />
  
  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- Monogram Letter D (Clean Geometric) -->
  <path
    fill="#ffffff"
    fill-rule="evenodd"
    filter="url(#subtleShadow)"
    d="M 19 16
       L 33 16
       C 42 16 48 22 48 32
       C 48 42 42 48 33 48
       L 19 48
       Z
       M 26 23
       L 32 23
       C 37 23 41 27 41 32
       C 41 37 37 41 32 41
       L 26 41
       Z"
  />

  <!-- Glowing Terminal Accent Dot -->
  <circle cx="49" cy="46" r="6" fill="url(#cyanGlow)" />
  <circle cx="49" cy="46" r="3" fill="#38bdf8" />
  <circle cx="49" cy="46" r="1.5" fill="#ffffff" />
</svg>